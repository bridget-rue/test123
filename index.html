
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rue | Independent Fashion</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #F5F0E9;
      color: #352C2A;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 8%;
      border-bottom: 1px solid #D9CEC3;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 42px;
      letter-spacing: -2px;
    }

    nav a {
      margin-left: 25px;
      color: #352C2A;
      text-decoration: none;
      font-size: 14px;
    }

    .hero {
      text-align: center;
      padding: 100px 20px;
      background: #E8D8CD;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: clamp(38px, 6vw, 68px);
      font-weight: normal;
      margin: 0 0 20px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 35px;
    }

    button {
      background: #752F43;
      color: white;
      border: none;
      padding: 15px 30px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #512031;
    }

    .products {
      padding: 65px 8%;
      text-align: center;
    }

    .products h2 {
      font-family: Georgia, serif;
      font-size: 35px;
      font-weight: normal;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 35px;
    }

    .product-image {
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      background: #DFD0C1;
    }

    .product h3 {
      font-size: 16px;
      font-weight: normal;
    }

    .product p {
      color: #752F43;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #352C2A;
      color: white;
    }

    @media (max-width: 650px) {
      header {
        flex-direction: column;
        gap: 15px;
      }

      nav a {
        margin: 0 8px;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Rue</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#shop">Shop</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h1>Beyond the Ordinary.</h1>
    <p>Discover independent designers and unique pieces.</p>
    <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">
      Explore the Collection
    </button>
  </section>

  <section class="products" id="shop">
    <h2>The Rue Edit</h2>
    <p>Thoughtfully curated. Independently designed.</p>

    <div class="product-grid">

      <div class="product">
        <div class="product-image">👜</div>
        <h3>The Everyday Bag</h3>
        <p>$189 AUD</p>
      </div>

      <div class="product">
        <div class="product-image">👗</div>
        <h3>The Summer Dress</h3>
        <p>$245 AUD</p>
      </div>

      <div class="product">
        <div class="product-image">🧥</div>
        <h3>The Statement Jacket</h3>
        <p>$320 AUD</p>
      </div>

    </div>
  </section>

  <footer id="about">
    <p>Rue — Fashion with individuality.</p>
    <p>© 2026 Rue</p>
  </footer>

</body>
</html>
